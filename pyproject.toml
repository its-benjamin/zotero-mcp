[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zotero-mcp-server"
dynamic = ["version"]
authors = [
  { name = "its-benjamin", email = "its-benjamin@users.noreply.github.com" },
]
description = "A Model Context Protocol server for Zotero"
keywords = ["zotero", "mcp", "model-context-protocol", "cli", "research", "citations", "bibliography"]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyzotero>=1.12.0",
    "mcp>=1.27.1",
    "python-dotenv>=1.2.2",
    "markitdown[pdf]>=0.1.5",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "httpx>=0.28.1",
    "fastmcp[tasks]>=3.3.1",
    "unidecode>=1.4.0",
]

[project.optional-dependencies]
semantic = [
    "chromadb>=1.5.9",
    "sentence-transformers>=5.5.1",
    "openai>=2.37.0",
    "google-genai>=2.5.0",
    "voyageai>=0.3.7",
    "tiktoken>=0.13.0",
    "onnxruntime>=1.26.0",
    "torch>=2.12.0",
]
pdf = [
    "pymupdf>=1.27.2.3",
    "ebooklib>=0.20",
]
pdf-llm = [
    "pymupdf4llm>=0.0.28",
]
paddleocr = [
    "paddlepaddle>=3.3.0",
    "paddleocr>=3.7.0",
    "pymupdf>=1.27.2.3",
]
# scite extra kept for backwards compatibility; requests is already in core deps
scite = []
all = [
    # Flattened: semantic + pdf + pdf-llm + paddleocr (scite deps already in core)
    "chromadb>=1.5.9",
    "sentence-transformers>=5.5.1",
    "openai>=2.37.0",
    "google-genai>=2.5.0",
    "voyageai>=0.3.7",
    "tiktoken>=0.13.0",
    "onnxruntime>=1.26.0",
    "torch>=2.12.0",
    "pymupdf>=1.27.2.3",
    "pymupdf4llm>=0.0.28",
    "ebooklib>=0.20",
    "paddlepaddle>=3.3.0",
    "paddleocr>=3.7.0",
]
dev = [
    "zotero-mcp-server[all]",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
    "pytest-xdist>=3.8.0",
]

[project.urls]
"Homepage" = "https://github.com/its-benjamin/zotero-mcp"
"Bug Tracker" = "https://github.com/its-benjamin/zotero-mcp/issues"
"Documentation" = "https://github.com/its-benjamin/zotero-mcp#readme"
"Changelog" = "https://github.com/its-benjamin/zotero-mcp/releases"

[project.scripts]
zotero-cli = "zotero_mcp.cli_standalone:main"
zotero-mcp = "zotero_mcp.cli:main"


[tool.hatch.version]
path = "src/zotero_mcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zotero_mcp"]
artifacts = ["src/zotero_mcp/py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

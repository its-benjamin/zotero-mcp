name: Feature request
description: Suggest a new tool, integration, or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do that is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature or behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you have tried or thought about.
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - New MCP tool
        - Existing tool improvement
        - CLI
        - Semantic search
        - Documentation
        - Other
    validations:
      required: true
